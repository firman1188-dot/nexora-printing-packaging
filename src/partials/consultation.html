<div class="modal" data-consultation-modal aria-hidden="true">
  <div class="modal-backdrop" data-close-consultation></div>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="consultation-title">
    <button class="modal-close" type="button" data-close-consultation aria-label="Tutup">×</button>
    <span class="kick">Smart Consultation</span>
    <h2 id="consultation-title">Ceritakan ide produk Anda</h2>
    <p class="lead">Tiga langkah singkat. Kami susun pesan WhatsApp otomatis agar konsultasi lebih jelas.</p>
    <div class="progress" aria-hidden="true"><span class="active"></span><span></span><span></span></div>
    <form>
      <fieldset class="active" data-step="1">
        <legend>Apa yang ingin dibuat?</legend>
        <div class="opts" data-consult-categories><label><input type="radio" name="category" value="Lainnya" required><span>Memuat…</span></label></div>
      </fieldset>
      <fieldset data-step="2">
        <legend>Sejauh mana persiapannya?</legend>
        <div class="choice">
          <label><input type="radio" name="design" value="Sudah memiliki desain final" required><span><b>Sudah punya desain</b><small>File desain siap diperiksa.</small></span></label>
          <label><input type="radio" name="design" value="Sudah memiliki referensi, tetapi belum final"><span><b>Ada referensi</b><small>Masih perlu penyesuaian.</small></span></label>
          <label><input type="radio" name="design" value="Masih berupa ide dan membutuhkan bantuan desain"><span><b>Masih berupa ide</b><small>Butuh bantuan dari awal.</small></span></label>
        </div>
      </fieldset>
      <fieldset data-step="3">
        <legend>Lengkapi kebutuhan dasar</legend>
        <label class="field">Nama<input type="text" name="name" placeholder="Nama Anda" required autocomplete="name"></label>
        <label class="field">Perkiraan jumlah<input type="text" name="quantity" placeholder="Contoh: 1.000 pcs" required></label>
        <label class="field">Catatan kebutuhan<textarea name="notes" rows="3" placeholder="Ukuran, target selesai, jenis produk, atau hal lain yang perlu diketahui."></textarea></label>
      </fieldset>
      <div class="actions">
        <button type="button" class="btn" data-consult-back disabled>Kembali</button>
        <button type="button" class="btn p" data-consult-next>Lanjut</button>
        <button type="submit" class="btn glow" data-consult-submit hidden>Kirim ke WhatsApp</button>
      </div>
    </form>
  </section>
</div>
